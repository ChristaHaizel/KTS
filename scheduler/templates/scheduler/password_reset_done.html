{% extends 'scheduler/auth_base.html' %}
{% block title %}Password changed - KTS{% endblock %}
{% block body %}
<div class="auth-card">
    <div class="auth-icon good"><i class="bi bi-check-circle"></i></div>
    <h4>Password changed</h4>
    <p class="auth-lede">
        You can sign in with your new password now. Students sign in with their
        student ID; everyone else with their username.
    </p>
    <a href="{% url 'login' %}" class="btn-login d-block text-center text-decoration-none">
        Sign in
    </a>
</div>
{% endblock %}
