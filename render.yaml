services:
  - type: web
    name: kts
    runtime: python
    plan: free
    # Migrations belong in preDeployCommand, but that is a paid-plan feature on
    # Render. On the free tier they run in the build step instead, which works
    # because the build has network access and the service environment variables.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn kts.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false          # set manually from Neon
